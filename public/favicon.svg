<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ibTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f4ff"/>
      <stop offset="1" stop-color="#5ccbec"/>
    </linearGradient>
    <linearGradient id="ibLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ccbec"/>
      <stop offset="1" stop-color="#1d8fc9"/>
    </linearGradient>
    <linearGradient id="ibRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ea8dd"/>
      <stop offset="1" stop-color="#0f5f8e"/>
    </linearGradient>
    <linearGradient id="ibPuddle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#1d6fb8"/>
    </linearGradient>
    <linearGradient id="ibGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="1" stop-color="#f0a13a"/>
    </linearGradient>
    <radialGradient id="ibBg" cx="0.5" cy="0.38" r="0.8">
      <stop offset="0" stop-color="#16395c"/>
      <stop offset="1" stop-color="#081426"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#ibBg)"/>

  <!-- chalk pitch circle -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#f5efe0" stroke-width="2.5"
          stroke-dasharray="9 7" opacity="0.3" stroke-linecap="round"/>

  <!-- chase speed lines -->
  <path d="M10 46 H28" stroke="#4dd0e1" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M16 58 H27" stroke="#4dd0e1" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>

  <!-- melt puddle -->
  <ellipse cx="66" cy="103" rx="32" ry="8.5" fill="url(#ibPuddle)" opacity="0.9"/>
  <ellipse cx="66" cy="103" rx="19" ry="5" fill="#a5e7fa" opacity="0.5"/>

  <!-- falling droplet -->
  <path d="M77 74 q6 15 0 21.5 q-6 -6.5 0 -21.5 z" fill="#4cc9f0"/>
  <path d="M77 79 q3 7.5 0 12" stroke="#d8f4ff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- ice cube, tilted, melting -->
  <g transform="rotate(-8 64 52)" stroke="#08263f" stroke-width="3" stroke-linejoin="round">
    <path d="M38 30 L66 16 L94 30 L66 44 Z" fill="url(#ibTop)"/>
    <path d="M38 30 L66 44 L66 74 Q57 80 51 79 Q43 77 38 70 Z" fill="url(#ibLeft)"/>
    <path d="M66 44 L94 30 L94 58 Q89 67 81 67 Q71 67 66 74 Z" fill="url(#ibRight)"/>
  </g>
  <g transform="rotate(-8 64 52)" stroke-linecap="round" fill="none">
    <path d="M46 33 L61 24" stroke="#f4fcff" stroke-width="3.5" opacity="0.95"/>
    <path d="M71 50 L88 41" stroke="#b8ecff" stroke-width="2.8" opacity="0.75"/>
    <path d="M45 40 L45 57 M53 43 L53 61" stroke="#a5e7fa" stroke-width="2.8" opacity="0.55"/>
    <path d="M66 44 L61 53 L67 61" stroke="#0d5d8a" stroke-width="2" opacity="0.85"/>
  </g>

  <!-- splash crown -->
  <path d="M58 99 l4 -6 4 6 M70 100 l3.5 -5 3.5 5" stroke="#8fdcf8" stroke-width="2.5"
        fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- gold sparkle -->
  <path d="M102 16 L104.6 23 L112 25.6 L104.6 28.2 L102 35.6 L99.4 28.2 L92 25.6 L99.4 23 Z"
        fill="url(#ibGold)" stroke="#8a6500" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
