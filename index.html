<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1b2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ice 'N' Water" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Ice 'N' Water</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0d1b2a;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }
      canvas {
        display: block;
      }
      /* rotate hint — portrait phones only */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #0d1b2a;
        color: #f5efe0;
        font-family: 'Fredoka', sans-serif;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
      }
      #rotate-hint .phone {
        font-size: 52px;
        animation: tilt 1.4s ease-in-out infinite;
        display: inline-block;
      }
      @keyframes tilt {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-90deg);
        }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate-hint">
      <span class="phone">📱</span>
      <div style="font-size: 20px; font-weight: 600">rotate your device</div>
      <div style="font-size: 14px; color: #7d93a5">ice 'n' water plays in landscape</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
