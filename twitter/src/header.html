<!doctype html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { width: 1500px; height: 500px; overflow: hidden; position: relative;
           font-family: 'Fredoka', sans-serif;
           background: radial-gradient(130% 120% at 30% 0%, #16395c 0%, #0d2038 50%, #081426 100%); }
    /* chalk pitch frame */
    .pitch { position: absolute; inset: 18px; border: 3px solid rgba(245,239,224,.14); border-radius: 8px; }
    .pitch::before { content:''; position: absolute; left: 50%; top: 0; bottom: 0;
                     border-left: 3px dashed rgba(245,239,224,.12); }
    .pitch::after { content:''; position: absolute; left: 50%; top: 50%; width: 190px; height: 190px;
                    border: 3px dashed rgba(245,239,224,.12); border-radius: 50%;
                    transform: translate(-50%,-50%); }
    .logo { position: absolute; left: 90px; top: 120px; width: 640px;
            filter: drop-shadow(0 12px 30px rgba(0,0,0,.5)); }
    /* the road: dashed route across the right half */
    .road { position: absolute; right: 70px; top: 150px; width: 620px; height: 210px; }
    .road svg { width: 100%; height: 100%; overflow: visible; }
    .town { font-weight: 600; fill: #f5efe0; opacity: .9; }
    .meta { position: absolute; right: 90px; bottom: 96px; text-align: right; }
    .meta .big { font-weight: 700; font-size: 34px; color: #ffd60a; letter-spacing: 1px;
                 text-shadow: 0 3px 0 rgba(0,0,0,.35); }
    .meta .small { font-weight: 500; font-size: 19px; color: #7fd8f0; opacity: .9; margin-top: 4px; }
    .drop { position: absolute; background: rgba(154,220,240,.45); border-radius: 50% 50% 60% 60%; }
  </style>
</head>
<body>
  <div class="pitch"></div>
  <img class="logo" src="../../logo.svg" alt="">

  <div class="road">
    <svg viewBox="0 0 620 210" fill="none">
      <path d="M20 170 C 130 190, 170 60, 300 80 S 480 40, 590 60"
            stroke="#4dd0e1" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round" opacity=".8"/>
      <circle cx="20" cy="170" r="12" fill="#3ecf6e" stroke="#08263f" stroke-width="3"/>
      <circle cx="300" cy="80" r="12" fill="#4dd0e1" stroke="#08263f" stroke-width="3"/>
      <circle cx="590" cy="60" r="12" fill="#ffd60a" stroke="#08263f" stroke-width="3"/>
      <text x="20" y="205" class="town" font-size="20" text-anchor="middle">LAGOS</text>
      <text x="300" y="58" class="town" font-size="20" text-anchor="middle">KANO</text>
      <text x="590" y="38" class="town" font-size="20" text-anchor="middle">MAIDUGURI</text>
      <!-- danfo on the road -->
      <g transform="translate(160 120) rotate(8)">
        <rect x="0" y="0" width="64" height="30" rx="7" fill="#f5c542" stroke="#08263f" stroke-width="3"/>
        <rect x="8" y="5" width="13" height="9" rx="2" fill="#0d2038"/>
        <rect x="26" y="5" width="13" height="9" rx="2" fill="#0d2038"/>
        <rect x="44" y="5" width="12" height="9" rx="2" fill="#0d2038"/>
        <rect x="0" y="19" width="64" height="6" fill="#ffffff" opacity=".85"/>
        <circle cx="15" cy="31" r="6" fill="#08263f"/>
        <circle cx="49" cy="31" r="6" fill="#08263f"/>
      </g>
    </svg>
  </div>

  <div class="meta">
    <div class="big">500 STOPS · 2 CAMPAIGNS</div>
    <div class="small">freeze tag · jailbreaks · danfo · NEPA — free in your browser</div>
  </div>

  <div class="drop" style="left:810px;top:60px;width:12px;height:15px"></div>
  <div class="drop" style="left:1450px;top:400px;width:10px;height:13px"></div>
</body>
</html>
